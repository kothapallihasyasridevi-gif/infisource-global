name: fix-upload-limit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cap the uploads
        run: python3 .github/scripts/fix_upload_limit.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Vendor form: cap uploads under the Netlify function limit"
            git push
          fi

      - name: Remove this one-off tooling
        run: |
          git rm -q .github/workflows/fix-upload-limit.yml .github/scripts/fix_upload_limit.py
          git commit -m "Remove one-off upload limit tooling"
          git push
