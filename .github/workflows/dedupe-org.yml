name: dedupe-org
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the older Organization node by position
        run: |
          python3 - <<'PY'
          import os
          MARK="<!-- infisource-entity-graph -->"
          s=open("index.html",encoding="utf-8").read()
          cut=s.index(MARK)
          print("marker at",cut,"file len",len(s))
          start=s.find('<script type="application/ld+json">', 0, cut)
          print("older ld+json starts at",start)
          if start!=-1:
              end=s.find("</script>", start)+len("</script>")
              block=s[start:end]
              has_org='"@type": "Organization"' in block or '"@type":"Organization"' in block
              is_mine='#organization' in block
              print("block len",len(block),"| Organization:",has_org,"| is mine:",is_mine)
              if has_org and not is_mine:
                  while start>0 and s[start-1] in " \t\n":
                      start-=1
                  s=s[:start]+s[end:]
                  open("index.html","w",encoding="utf-8").write(s)
                  print("REMOVED older Organization node; new len",len(s))
              else:
                  print("nothing removed (not the node we expected)")
          else:
              print("no pre-marker ld+json found")
          wf=".github/workflows/dedupe-org.yml"
          if os.path.exists(wf): os.remove(wf); print("removed",wf)
          PY
          git config user.name "infisource-bot"
          git config user.email "bot@infisource.in"
          git add -A
          git commit -m "seo: remove duplicate Organization node" || echo "nothing to commit"
          git push
