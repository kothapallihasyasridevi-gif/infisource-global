name: apply-revert
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the tree to the pre-today state
        run: |
          git checkout 3f49a8200d77cb169669e77fa7fda072445b04f4 -- .
          for f in $(git ls-files); do
            git cat-file -e 3f49a8200d77cb169669e77fa7fda072445b04f4:"$f" 2>/dev/null || git rm -q "$f"
          done
          git config user.name "infisource-bot"
          git config user.email "bot@infisource.in"
          git commit -m "revert: restore site to the state before today's changes" || echo "nothing to commit"
          git push
          echo "--- files now ---"
          git ls-files | head -40
