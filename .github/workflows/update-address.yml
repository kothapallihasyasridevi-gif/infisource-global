name: update-address
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalise the registered address
        run: |
          python3 - <<'PY'
          import os
          OLD = "Unit No 203, 2nd Floor Suite No.789,"
          NEW = "Unit No 203, 2nd Floor, Suite No. 789,"
          total = 0
          for f in ["index.html", "about.html", "services.html", "contact.html", "vendor.html"]:
              s = open(f, encoding="utf-8").read()
              n = s.count(OLD)
              if n:
                  s = s.replace(OLD, NEW)
                  open(f, "w", encoding="utf-8").write(s)
              print(f, "->", n, "replacement(s)")
              total += n
          print("total replacements:", total)
          wf = ".github/workflows/update-address.yml"
          if os.path.exists(wf):
              os.remove(wf); print("removed", wf)
          PY
          git config user.name "infisource-bot"
          git config user.email "bot@infisource.in"
          git add -A
          git commit -m "content: normalise the registered address across the site" || echo "nothing to commit"
          git push
