name: remove-heads-up

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the note
        run: python3 .github/scripts/remove_heads_up.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Vendor page: remove the Heads-up note"
            git push
          fi

      - name: Remove this one-off tooling
        run: |
          git rm -q .github/workflows/remove-heads-up.yml .github/scripts/remove_heads_up.py
          git commit -m "Remove one-off note tooling"
          git push
