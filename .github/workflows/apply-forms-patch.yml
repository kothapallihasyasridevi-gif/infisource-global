name: apply-forms-patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: python3 .github/scripts/patch_forms.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Vendor form: send registrations to info@infisource.in"
            git push
          fi

      - name: Remove this one-off tooling
        run: |
          git rm -q .github/workflows/apply-forms-patch.yml .github/scripts/patch_forms.py
          git commit -m "Remove one-off patch tooling"
          git push
