name: wire-vendor-form

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire the vendor form
        run: python3 .github/scripts/wire_vendor_form.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Vendor form: post submissions to the Netlify function"
            git push
          fi

      - name: Remove this one-off tooling
        run: |
          git rm -q .github/workflows/wire-vendor-form.yml .github/scripts/wire_vendor_form.py
          git commit -m "Remove one-off wiring tooling"
          git push
