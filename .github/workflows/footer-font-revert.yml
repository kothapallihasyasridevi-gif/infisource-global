name: footer-font-revert

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montserrat in the header wordmark only
        run: |
          set -e
          sed -i "s|\.brand, \.foot-brand \.fb-name{font-family:'Montserrat'|.brand{font-family:'Montserrat'|" assets/css/polish.css
          echo "--- font lines now ---"
          grep -n "Montserrat" assets/css/polish.css | tail -3
          rm -f .github/workflows/apply-font-montserrat.yml
          git config user.name "infisource-bot"
          git config user.email "info@infisource.in"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use Montserrat for the header wordmark only"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy site to Netlify
        env:
          NETLIFY_DEPLOY_PROXY: ${{ secrets.NETLIFY_DEPLOY_PROXY }}
        run: |
          npx -y @netlify/mcp@latest \
            --site-id beea0fd5-a4c1-4b04-bdcd-5462b8662b9b \
            --proxy-path "$NETLIFY_DEPLOY_PROXY"

      - name: Remove this one-off workflow
        run: |
          git rm .github/workflows/footer-font-revert.yml
          git commit -m "Remove one-off font revert workflow"
          git push
