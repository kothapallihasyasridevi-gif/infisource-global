name: fix-function

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix the function
        run: python3 .github/scripts/fix_function.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Sending function: install dependency at build time; report real errors"
            git push
          fi

      - name: Remove this one-off tooling
        run: |
          git rm -q .github/workflows/fix-function.yml .github/scripts/fix_function.py
          git commit -m "Remove one-off function tooling"
          git push
