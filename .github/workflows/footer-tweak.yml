name: footer-tweak

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revert centring and colour the labels
        run: python3 .github/scripts/footer_tweak.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Footer: revert centring; contact labels in orange"
            git push
          fi

      - name: Remove this one-off tooling
        run: |
          git rm -q .github/workflows/footer-tweak.yml .github/scripts/footer_tweak.py
          git commit -m "Remove one-off footer tooling"
          git push
