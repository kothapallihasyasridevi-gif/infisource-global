name: style-vendor-note

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the styling
        run: python3 .github/scripts/style_note.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Vendor page: italic note with more space above"
            git push
          fi

      - name: Remove this one-off tooling
        run: |
          git rm -q .github/workflows/style-vendor-note.yml .github/scripts/style_note.py
          git commit -m "Remove one-off styling tooling"
          git push
