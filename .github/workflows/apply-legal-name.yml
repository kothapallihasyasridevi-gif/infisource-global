name: apply-legal-name

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short brand in header, full legal name everywhere else
        run: |
          python3 - <<'PY'
          import pathlib

          OLD_BRAND = '<span>InfiSource <span class="accent">Corporation</span></span>'
          NEW_BRAND = '<span>InfiSource</span>'
          FULL = "InfiSource Corporation Private Limited"

          OK = ('.html', '.mjs', '.js', '.md', '.txt', '.json', '.xml', '.css')
          for f in sorted(pathlib.Path('.').rglob('*')):
              if not f.is_file(): continue
              if '.git' in f.parts or 'node_modules' in f.parts: continue
              if f.suffix.lower() not in OK: continue
              s = f.read_text(encoding='utf-8', errors='ignore')
              o = s
              # 1. header brand becomes just "InfiSource"
              s = s.replace(OLD_BRAND, NEW_BRAND)
              # 2. guard against double-applying on a re-run
              s = s.replace(FULL, "InfiSource Corporation")
              # 3. every remaining mention becomes the full legal name
              s = s.replace("InfiSource Corporation", FULL)
              if s != o:
                  f.write_text(s, encoding='utf-8')
                  print('updated', f)
          print('done')
          PY

      - name: Show what the header and footer now say
        run: |
          echo "--- header brand ---"
          grep -o 'class="brand"[^>]*>.*</a>' index.html | head -1 | cut -c1-260
          echo "--- footer name ---"
          grep -o 'fb-name">[^<]*' index.html | head -1
          echo "--- copyright ---"
          grep -o '&copy; 2026[^<]*' index.html | head -1

      - name: Commit and push
        run: |
          git config user.name "infisource-bot"
          git config user.email "info@infisource.in"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Header shows InfiSource; full legal name elsewhere"
            git push
          fi

      - name: Remove this workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-legal-name.yml 2>/dev/null || true
          git commit -m "Remove one-off legal-name workflow" 2>/dev/null || true
          git push 2>/dev/null || true
