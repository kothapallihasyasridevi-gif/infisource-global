name: apply-seo-head

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert SEO head tags
        run: |
          python3 - <<'PY'
          import pathlib

          PAGES = {
            "index.html":    ("https://infisource.in/",             "Corporate Procurement Company in India | InfiSource Corporation", "One accountable partner for workplace procurement and facility solutions across 18 categories. Pan-India sourcing, GST-compliant billing."),
            "services.html": ("https://infisource.in/services.html",  "Office & Facility Supplies - 18 Sourcing Categories | InfiSource", "MEP, housekeeping, stationery, HVAC, security, IT, furniture and more. One verified pan-India supplier network for every workplace requirement."),
            "about.html":    ("https://infisource.in/about.html",     "About InfiSource Corporation | Procurement Partner in India", "InfiSource Corporation consolidates multi-category procurement under one roof - one relationship, one invoice, one accountable point of contact."),
            "contact.html":  ("https://infisource.in/contact.html",   "Contact InfiSource Corporation | Procurement Supplier, Hyderabad", "Talk to our sourcing team in Hyderabad. Share your requirement, BOQ or category interest and get a structured quotation."),
            "vendor.html":   ("https://infisource.in/vendor.html",    "Vendor Registration India | Register as a Supplier | InfiSource", "Join our verified pan-India supplier network. One short form covering GST, MSME, categories served and payment terms."),
          }

          ORG = '''<script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "InfiSource Corporation",
            "url": "https://infisource.in",
            "logo": "https://infisource.in/assets/img/logo.webp",
            "email": "info@infisource.in",
            "telephone": "+917702463889",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "5th Floor, Ayyappa Central, Plot Nos. 802 & 803, Ayyappa Society, Khanamet, Madhapur",
              "addressLocality": "Hyderabad",
              "addressRegion": "Telangana",
              "postalCode": "500081",
              "addressCountry": "IN"
            },
            "areaServed": "IN",
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+917702463889",
              "contactType": "sales",
              "areaServed": "IN",
              "availableLanguage": ["en", "hi"]
            }
          }
          </script>
          '''

          for fname, (url, title, desc) in PAGES.items():
              p = pathlib.Path(fname)
              if not p.exists():
                  print('missing', fname); continue
              s = p.read_text(encoding='utf-8')
              if 'rel="canonical"' in s:
                  print('already done', fname); continue
              block = (
                f'<link rel="canonical" href="{url}" />\n'
                f'<meta property="og:type" content="website" />\n'
                f'<meta property="og:site_name" content="InfiSource Corporation" />\n'
                f'<meta property="og:title" content="{title}" />\n'
                f'<meta property="og:description" content="{desc}" />\n'
                f'<meta property="og:url" content="{url}" />\n'
                f'<meta property="og:image" content="https://infisource.in/assets/img/logo.webp" />\n'
                f'<meta property="og:locale" content="en_IN" />\n'
                f'<meta name="twitter:card" content="summary_large_image" />\n'
                f'<meta name="twitter:title" content="{title}" />\n'
                f'<meta name="twitter:description" content="{desc}" />\n'
                f'<meta name="twitter:image" content="https://infisource.in/assets/img/logo.webp" />\n'
              )
              if fname == 'index.html':
                  block += ORG
              s = s.replace('</head>', block + '</head>', 1)
              p.write_text(s, encoding='utf-8')
              print('patched', fname)
          PY

      - name: Clean up leftover one-off workflows
        run: |
          git rm -f .github/workflows/diag-deploy.yml .github/workflows/footer-font-revert.yml .github/workflows/apply-font-montserrat.yml 2>/dev/null || true

      - name: Commit and push
        run: |
          git config user.name "infisource-bot"
          git config user.email "info@infisource.in"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add SEO head tags (canonical, Open Graph, Twitter, JSON-LD) and clean up"
            git push
          fi

      - name: Remove this workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-seo-head.yml 2>/dev/null || true
          git commit -m "Remove one-off SEO workflow" 2>/dev/null || true
          git push 2>/dev/null || true
