name: apply-entity-graph
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the invisible entity graph
        run: |
          python3 - <<'PY'
          import re, json
          SITE="https://infisource.in"
          CATS=["MEP Solutions","Facility Maintenance","Safety & Fire Protection","HVAC & Air Quality","Security & Access Control","Stationery & Office Supplies","Housekeeping","Pantry & Cafeteria","Office Furniture","Office Appliances","IT & Networking","AV & Meeting Rooms","Printing & Branding","Gifting & Uniforms","Packaging & Storage","Plants & Landscaping","Recreation & Engagement","Sustainability"]
          TOPICS=CATS+["Corporate procurement","Strategic sourcing","Vendor management","MRO supplies","Facility management supplies","Bulk office supplies","Corporate gifting","Workplace procurement","Pan-India sourcing"]
          ADDR={"@type":"PostalAddress","streetAddress":"Unit No 203, 2nd Floor Suite No.789, SBR CV Towers, Sector-I, Sy No 64, HUDA Techno Enclave, Madhapur","addressLocality":"Hyderabad","addressRegion":"Telangana","postalCode":"500081","addressCountry":"IN"}
          ORG_ID=SITE+"/#organization"
          SITE_ID=SITE+"/#website"
          ORG={"@context":"https://schema.org","@type":"Organization","@id":ORG_ID,"name":"InfiSource Corporation","legalName":"InfiSource Corporation Private Limited","url":SITE+"/","logo":{"@type":"ImageObject","url":SITE+"/assets/img/logo.webp"},"email":"info@infisource.in","telephone":"+917702463889","address":ADDR,"areaServed":{"@type":"Country","name":"India"},"knowsAbout":TOPICS,"contactPoint":{"@type":"ContactPoint","telephone":"+917702463889","email":"info@infisource.in","contactType":"sales","areaServed":"IN","availableLanguage":["en","hi"]},"hasOfferCatalog":{"@type":"OfferCatalog","name":"Corporate procurement categories","itemListElement":[{"@type":"Offer","itemOffered":{"@type":"Service","name":c}} for c in CATS]}}
          WEBSITE={"@context":"https://schema.org","@type":"WebSite","@id":SITE_ID,"url":SITE+"/","name":"InfiSource Corporation Private Limited","inLanguage":"en-IN","publisher":{"@id":ORG_ID}}
          LOCAL={"@context":"https://schema.org","@type":"LocalBusiness","@id":SITE+"/#localbusiness","name":"InfiSource Corporation Private Limited","url":SITE+"/contact.html","image":SITE+"/assets/img/logo.webp","email":"info@infisource.in","telephone":"+917702463889","address":ADDR,"geo":{"@type":"GeoCoordinates","latitude":17.44167,"longitude":78.39167},"areaServed":{"@type":"Country","name":"India"},"parentOrganization":{"@id":ORG_ID}}
          PAGES=[("index.html","Home"),("about.html","About Us"),("services.html","Sourcing Categories"),("contact.html","Contact Us"),("vendor.html","Vendor Registration")]
          MARK="<!-- infisource-entity-graph -->"
          for f,label in PAGES:
              s=open(f,encoding="utf-8").read()
              if MARK in s:
                  print("skip",f); continue
              m=re.search(r'rel="canonical" href="([^"]+)"',s)
              canon=m.group(1)
              blocks=[ORG]
              if f=="index.html":
                  blocks.append(WEBSITE)
              blocks.append({"@context":"https://schema.org","@type":"WebPage","@id":canon+"#webpage","url":canon,"name":label,"inLanguage":"en-IN","isPartOf":{"@id":SITE_ID},"about":{"@id":ORG_ID}})
              blocks.append({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":SITE+"/"},{"@type":"ListItem","position":2,"name":label,"item":canon}]})
              if f=="services.html":
                  blocks.append({"@context":"https://schema.org","@type":"ItemList","name":"InfiSource sourcing categories","numberOfItems":len(CATS),"itemListElement":[{"@type":"ListItem","position":i+1,"name":c,"url":SITE+"/services.html"} for i,c in enumerate(CATS)]})
              if f=="contact.html":
                  blocks.append(LOCAL)
              payload=MARK+"\n"+"\n".join('<script type="application/ld+json">'+json.dumps(b,separators=(",",":"),ensure_ascii=False)+'</script>' for b in blocks)
              s=s.replace("</head>",payload+"\n</head>",1)
              open(f,"w",encoding="utf-8").write(s)
              print("added",len(blocks),"blocks to",f)
          PY
          git config user.name "infisource-bot"
          git config user.email "bot@infisource.in"
          git add -A
          git commit -m "seo: add invisible entity graph (structured data), no visual change" || echo "nothing to commit"
          git push
