name: entity-graph-cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dedupe Organization and remove one-off workflows
        run: |
          python3 - <<'PY'
          import re, os
          MARK="<!-- infisource-entity-graph -->"
          s=open("index.html",encoding="utf-8").read()
          i=s.index(MARK)
          head, tail = s[:i], s[i:]
          pat=re.compile(r'\s*<script type="application/ld\+json">.*?</script>', re.S)
          removed=0
          def drop(m):
              global removed
              if '"Organization"' in m.group(0):
                  removed+=1
                  return ''
              return m.group(0)
          head=pat.sub(drop, head)
          open("index.html","w",encoding="utf-8").write(head+tail)
          print("removed duplicate Organization blocks:", removed)
          for wf in [".github/workflows/apply-entity-graph.yml",
                     ".github/workflows/entity-graph-cleanup.yml"]:
              if os.path.exists(wf):
                  os.remove(wf); print("removed", wf)
          PY
          git config user.name "infisource-bot"
          git config user.email "bot@infisource.in"
          git add -A
          git commit -m "seo: dedupe Organization node, remove one-off workflows" || echo "nothing to commit"
          git push
